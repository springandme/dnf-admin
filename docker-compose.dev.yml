version: "3.8"

# 开发环境 Docker Compose 配置
# 使用本地构建的多架构镜像进行测试

services:
  dnf-admin-dev:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
    image: dnf-admin:dev
    container_name: dnf-admin-dev
    ports:
      - "8888:8888"
    environment:
      - TZ=Asia/Shanghai
      - JAVA_OPTS=-Xmx2g -Xms512m
      - SPRING_PROFILES_ACTIVE=dev
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8888/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  default:
    name: dnf-admin-dev
